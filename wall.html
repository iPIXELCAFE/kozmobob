<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HALL OF FREQUENCY — KozmoBob 369</title>
<meta name="description" content="The Hall of Frequency. Those who completed the 369 ritual and sent their intentions to the universe.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:#000;
    color:rgba(255,220,80,.88);
    font-family:'Courier New',Courier,monospace;
    min-height:100vh;
    overflow-x:hidden;
  }
  /* star bg */
  body::before{
    content:'';position:fixed;inset:0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(80,0,120,.18) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 70%, rgba(0,40,120,.15) 0%, transparent 60%);
    pointer-events:none;z-index:0;
  }
  .page{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:40px 20px 80px;}

  /* header */
  .wall-header{text-align:center;margin-bottom:50px;}
  .wall-symbol{font-size:clamp(2.5rem,8vw,4.5rem);line-height:1;margin-bottom:16px;
    text-shadow:0 0 40px rgba(255,200,40,.6);animation:wallFloat 4s ease-in-out infinite;}
  @keyframes wallFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  .wall-title{font-size:clamp(1.2rem,5vw,2rem);letter-spacing:.4em;color:rgba(255,215,60,.97);
    text-shadow:0 0 30px rgba(255,200,40,.5);margin-bottom:10px;}
  .wall-sub{font-size:clamp(.55rem,2vw,.72rem);letter-spacing:.14em;color:rgba(255,200,40,.45);line-height:2;}
  .wall-back{display:inline-block;margin-top:18px;background:rgba(0,0,0,.6);
    border:1px solid rgba(255,200,40,.3);border-radius:20px;
    color:rgba(255,210,60,.72);font-family:inherit;font-size:.55rem;
    letter-spacing:.18em;padding:7px 16px;cursor:pointer;
    text-transform:uppercase;transition:all .2s;text-decoration:none;}
  .wall-back:hover{border-color:rgba(255,215,60,.7);color:rgba(255,225,80,1);}

  /* tier sections */
  .tier-section{margin-bottom:48px;}
  .tier-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;
    padding-bottom:12px;border-bottom:1px solid rgba(255,200,40,.12);}
  .tier-icon{font-size:clamp(1.4rem,4vw,2rem);line-height:1;filter:drop-shadow(0 0 10px currentColor);}
  .tier-name-wrap{}
  .tier-days{font-size:clamp(1rem,3.5vw,1.35rem);letter-spacing:.3em;font-weight:bold;}
  .tier-label{font-size:.5rem;letter-spacing:.2em;opacity:.55;margin-top:2px;}
  .tier-count{margin-left:auto;font-size:.7rem;letter-spacing:.12em;opacity:.4;}

  /* tier colors */
  .t9  .tier-icon,.t9  .tier-days{color:rgba(255,215,60,.97);}
  .t33 .tier-icon,.t33 .tier-days{color:rgba(200,150,255,.97);}
  .t66 .tier-icon,.t66 .tier-days{color:rgba(60,220,255,.97);}
  .t99 .tier-icon,.t99 .tier-days{color:rgba(255,130,60,.97);}
  .t9  {border-left:2px solid rgba(255,215,60,.35);padding-left:14px;}
  .t33 {border-left:2px solid rgba(200,150,255,.35);padding-left:14px;}
  .t66 {border-left:2px solid rgba(60,220,255,.35);padding-left:14px;}
  .t99 {border-left:2px solid rgba(255,130,60,.35);padding-left:14px;}

  /* name grid */
  .tier-names{display:flex;flex-wrap:wrap;gap:8px;}
  .tier-name{
    background:rgba(255,200,40,.04);
    border:1px solid rgba(255,200,40,.14);
    border-radius:8px;
    padding:7px 13px;
    font-size:clamp(.52rem,1.8vw,.66rem);
    letter-spacing:.1em;
    color:rgba(255,220,80,.8);
    transition:all .2s;
  }
  .t33 .tier-name{border-color:rgba(200,150,255,.18);color:rgba(200,150,255,.82);}
  .t66 .tier-name{border-color:rgba(60,220,255,.18);color:rgba(60,220,255,.82);}
  .t99 .tier-name{border-color:rgba(255,130,60,.18);color:rgba(255,130,60,.82);}
  .tier-name:hover{background:rgba(255,200,40,.08);border-color:rgba(255,200,40,.35);}
  .tier-name .ts{font-size:.38rem;opacity:.4;display:block;margin-top:2px;letter-spacing:.08em;}

  .tier-empty{font-size:.56rem;letter-spacing:.14em;color:rgba(255,200,40,.25);font-style:italic;padding:10px 0;}

  /* loading / error */
  .wall-loading{text-align:center;padding:60px 20px;font-size:.7rem;letter-spacing:.2em;
    color:rgba(255,200,40,.4);animation:wallPulse 1.8s ease-in-out infinite;}
  @keyframes wallPulse{0%,100%{opacity:.3}50%{opacity:.9}}

  /* claim banner (if user has local badge) */
  #claim-wrap{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    width:min(500px,92vw);background:rgba(0,0,0,.9);
    border:1px solid rgba(255,200,40,.4);border-radius:16px;
    padding:18px 20px;z-index:10;backdrop-filter:blur(8px);text-align:center;}
  #claim-wrap.on{display:block;}
  .claim-title{font-size:.68rem;letter-spacing:.2em;color:rgba(255,215,60,.9);margin-bottom:10px;}
  .claim-row{display:flex;gap:8px;align-items:center;justify-content:center;}
  #claim-name{flex:1;max-width:220px;background:rgba(0,0,0,.7);
    border:1px solid rgba(255,200,40,.35);border-radius:10px;
    color:rgba(255,220,60,.95);font-family:inherit;font-size:.7rem;
    letter-spacing:.1em;padding:9px 12px;text-align:center;text-transform:uppercase;outline:none;}
  #claim-name::placeholder{color:rgba(255,200,40,.2);}
  #claim-btn{background:rgba(0,0,0,.7);border:1.5px solid rgba(255,200,40,.5);border-radius:10px;
    color:rgba(255,220,60,.95);font-family:inherit;font-size:.65rem;letter-spacing:.18em;
    padding:9px 16px;cursor:pointer;text-transform:uppercase;transition:all .2s;white-space:nowrap;}
  #claim-btn:hover{background:rgba(255,200,40,.12);box-shadow:0 0 18px rgba(255,200,40,.35);}
  #claim-msg{font-size:.52rem;color:rgba(255,200,40,.4);letter-spacing:.1em;margin-top:8px;min-height:1.4em;}
  #claim-close{position:absolute;top:10px;right:14px;background:none;border:none;
    color:rgba(255,200,40,.4);font-size:.9rem;cursor:pointer;font-family:inherit;}

  /* divider */
  .wall-divider{text-align:center;margin:40px 0;font-size:.55rem;letter-spacing:.3em;
    color:rgba(255,200,40,.2);}
</style>
</head>
<body>
<div class="page">

  <div class="wall-header">
    <div class="wall-symbol">✦</div>
    <div class="wall-title">HALL OF FREQUENCY</div>
    <div class="wall-sub">
      THOSE WHO KEPT THE SIGNAL ALIVE<br>
      3 INTENTIONS · 6 TRANSMITS · EVERY SINGLE DAY
    </div>
    <a href="/369" class="wall-back">← BACK TO 369 RITUAL</a>
  </div>

  <div id="wall-content" class="wall-loading">LOADING FREQUENCY RECORDS...</div>

</div>

<!-- claim banner -->
<div id="claim-wrap">
  <button id="claim-close">✕</button>
  <div class="claim-title" id="claim-title">✦ YOU COMPLETED THE RITUAL — CLAIM YOUR PLACE ✦</div>
  <div class="claim-row">
    <input id="claim-name" type="text" placeholder="YOUR NAME OR ALIAS" maxlength="30">
    <button id="claim-btn">⚡ CLAIM</button>
  </div>
  <div id="claim-msg"></div>
</div>

<script>
(function(){
  var TIERS = [
    {days:9,  icon:'⚡', label:'SPARK',    key:'t9'},
    {days:33, icon:'✦',  label:'INITIATE', key:'t33'},
    {days:66, icon:'◈',  label:'CHANNEL',  key:'t66'},
    {days:99, icon:'∞',  label:'MASTER',   key:'t99'},
  ];

  function fmtDate(iso){
    if(!iso)return'';
    var d=new Date(iso);
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  }

  function renderWall(tiers){
    var html='';
    TIERS.forEach(function(t){
      var list=tiers[t.days]||[];
      html+='<div class="tier-section '+t.key+'">';
      html+='<div class="tier-head">';
      html+='<span class="tier-icon">'+t.icon+'</span>';
      html+='<div class="tier-name-wrap"><div class="tier-days">'+t.days+' DAYS</div><div class="tier-label">'+t.label+'</div></div>';
      html+='<span class="tier-count">'+list.length+' SOULS</span>';
      html+='</div>';
      if(list.length===0){
        html+='<div class="tier-empty">BE THE FIRST TO COMPLETE THIS TIER</div>';
      } else {
        html+='<div class="tier-names">';
        list.forEach(function(entry){
          html+='<div class="tier-name">'+entry.name+'<span class="ts">'+fmtDate(entry.completedAt)+'</span></div>';
        });
        html+='</div>';
      }
      html+='</div>';
      if(t.days!==99) html+='<div class="wall-divider">· · ·</div>';
    });
    document.getElementById('wall-content').innerHTML=html;
  }

  /* load wall */
  fetch('/api/get-wall')
    .then(function(r){return r.json();})
    .then(function(d){renderWall(d.tiers||{});})
    .catch(function(){
      document.getElementById('wall-content').innerHTML=
        '<div class="wall-loading" style="animation:none;opacity:.4">COULD NOT LOAD RECORDS</div>';
    });

  /* check if user has a local badge to claim */
  (function checkClaim(){
    var badge=parseInt(localStorage.getItem('__kb369_badge'))||0;
    var claimed=parseInt(localStorage.getItem('__kb369_claimed'))||0;
    if(badge>0&&badge>claimed){
      var t=TIERS.filter(function(x){return x.days===badge;})[0];
      if(t){
        document.getElementById('claim-title').textContent=
          '✦ YOU COMPLETED '+badge+' DAYS '+t.icon+' — CLAIM YOUR PLACE ON THE WALL ✦';
        document.getElementById('claim-wrap').classList.add('on');
      }
    }
  })();

  document.getElementById('claim-close').addEventListener('click',function(){
    document.getElementById('claim-wrap').classList.remove('on');
  });

  document.getElementById('claim-btn').addEventListener('click',function(){
    var badge=parseInt(localStorage.getItem('__kb369_badge'))||0;
    if(!badge)return;
    var name=document.getElementById('claim-name').value.trim();
    if(!name){document.getElementById('claim-name').focus();return;}
    var btn=document.getElementById('claim-btn');
    var msg=document.getElementById('claim-msg');
    btn.disabled=true;btn.textContent='SENDING...';
    var did='wall_'+(Math.random().toString(36).slice(2));
    fetch('/api/complete-tier',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({deviceId:did,name:name,tier:badge})
    })
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.ok){
        localStorage.setItem('__kb369_claimed',badge);
        msg.textContent='✦ YOU ARE ON THE WALL ✦';
        msg.style.color='rgba(0,255,120,.85)';
        setTimeout(function(){
          document.getElementById('claim-wrap').classList.remove('on');
          fetch('/api/get-wall').then(function(r){return r.json();}).then(function(d){renderWall(d.tiers||{});});
        },2000);
      } else {
        msg.textContent='ERROR — TRY AGAIN';btn.disabled=false;btn.textContent='⚡ CLAIM';
      }
    })
    .catch(function(){
      msg.textContent='ERROR — TRY AGAIN';btn.disabled=false;btn.textContent='⚡ CLAIM';
    });
  });
})();
</script>
</body>
</html>
